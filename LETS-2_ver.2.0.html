<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Scale Feedback</title>
  <link href="jspsych/dist/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="jspsych/dist/jspsych.js"></script>
  <script src="jspsych/dist/plugin-survey-likert.js"></script>
  <script src="chart_js/dist/chart.umd.min.js"></script>
  <style>
    /* 画面全体と共通部品 */
    :root {
      color-scheme: light;
    }

    /* ページ切り替え時にブラウザが勝手にスクロール位置をずらさないようにする */
    html,
    body {
      overflow-anchor: none;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #1d2939;
      font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    #jspsych-content {
      max-width: 980px;
    }

    .card {
      margin: 24px auto;
      padding: 28px 32px;
      background: #fff;
      border: 1px solid #dce3ed;
      border-radius: 16px;
      box-shadow: 0 8px 24px #243b5310;
    }

    .eyebrow {
      color: #315da8;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .06em;
    }

    h1 {
      margin: 8px 0 16px;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    h2 {
      margin: 8px 0 16px;
      font-size: 1.35rem;
    }

    p {
      line-height: 1.8;
    }

    .muted {
      color: #526277;
      font-size: .94rem;
    }

    .jspsych-btn {
      padding: 12px 22px;
      background: #2659a8;
      border: 0;
      border-radius: 9px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .jspsych-btn:hover {
      background: #17437f;
      color: #fff;
    }

    .jspsych-btn:focus-visible {
      outline: 3px solid #f4b548;
      outline-offset: 3px;
    }

    /* JsPsych の設問・選択肢 */
    .jspsych-survey-likert-preamble {
      text-align: left;
    }

    #jspsych-survey-likert-form .jspsych-survey-likert-statement {
      box-sizing: border-box;
      display: block;
      margin: 16px 0 0;
      padding: 16px 18px 4px;
      background: #fff;
      border: 1px solid #dce3ed;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      text-align: left;
    }

    #jspsych-survey-likert-form .jspsych-survey-likert-opts {
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      margin: 0 0 16px;
      padding: 0 12px 16px;
      background: #fff;
      border: 1px solid #dce3ed;
      border-top: 0;
      border-radius: 0 0 12px 12px;
    }

    #jspsych-survey-likert-form .jspsych-survey-likert-opt-label {
      line-height: 1.45;
    }

    #jspsych-survey-likert-form .jspsych-survey-likert-opt-label input {
      transform: scale(1.35);
      accent-color: #2659a8;
    }

    /* 結果画面 */
    .results {
      max-width: 900px;
      margin: 24px auto;
    }

    .chart-wrap {
      position: relative;
      max-width: 560px;
      margin: 18px auto;
    }

    .trait-descriptions {
      margin-top: 32px;
      text-align: left;
    }

    .trait-description {
      margin-top: 12px;
      padding: 16px 20px;
      background: #f4f7fb;
      border-left: 6px solid #2659a8;
      border-radius: 10px;
    }

    .trait-description h3 {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .trait-description p {
      margin: 0;
    }

    /* 狭い画面では選択肢を縦に並べる */
    @media (max-width: 700px) {
      .card {
        padding: 22px 18px;
      }

      #jspsych-survey-likert-form .jspsych-survey-likert-opts {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      #jspsych-survey-likert-form .jspsych-survey-likert-opts:before {
        display: none;
      }

      #jspsych-survey-likert-form .jspsych-survey-likert-opts li {
        width: 100% !important;
        padding: 5px 0;
        text-align: left;
      }

      #jspsych-survey-likert-form .jspsych-survey-likert-opt-label {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #jspsych-survey-likert-form .jspsych-survey-likert-opt-label input {
        position: static;
        margin: 0;
      }
    }
  </style>
</head>
<body>
<script>
"use strict";

/*
 * 調整する場所
 *   1. QUESTIONS_PER_PAGE: 1ページに表示する設問数（大きい値にすると各部を1ページにまとめます）
 *   2. DOMAINS: 6タイプの名前・色・解説
 *   3. PARTS: 第1部・第2部の教示文と設問（["タイプ記号", "設問文"]）
 *   4. LIKERT_LABELS: 回答の選択肢
 */

const QUESTIONS_PER_PAGE = 10;

// 6タイプ（表示順 = レーダーチャートの並び順）
const DOMAIN_ORDER = ["L", "P", "S", "A", "E", "M"];

const DOMAINS = {
  L: {
    label: "遊びの愛",
    reading: "（ルダス）",
    color: "#e74c3c",
    description: "恋愛をゲームと考えて楽しむことを大切にする。"
  },
  P: {
    label: "実利的愛",
    reading: "（プラグマ）",
    color: "#3498db",
    description: "恋愛を地位の上昇などの目的を達成するための手段と考える。"
  },
  S: {
    label: "友情的愛",
    reading: "（ストルゲ）",
    color: "#27ae60",
    description: "穏やかな友情的な愛。長い時間をかけて愛が育まれる。"
  },
  A: {
    label: "献身的愛",
    reading: "（アガペ）",
    color: "#d39e00",
    description: "相手の利益だけを考えて自分を犠牲にすることをいとわない。"
  },
  E: {
    label: "耽美的愛",
    reading: "（エロス）",
    color: "#9b59b6",
    description: "ロマンティックな愛。恋人の外見を重視する。"
  },
  M: {
    label: "狂気的愛",
    reading: "（マニア）",
    color: "#e67e22",
    description: "激しい感情をもち，独占欲が強く，嫉妬深い。"
  }
};

// 設問：[タイプ記号, 設問文]
const PARTS = [
  {
    id: "p1",
    title: "第1部",
    instruction: "恋人や好きな人もしくは，家族以外であなたにとってもっとも親しい異性について答えてください。",
    items: [
      ["E", "彼（彼女）と私は会うとすぐにお互いひかれあった。"],
      ["S", "私たちの友情がいつ愛に変わったのか，はっきりとは言えない。"],
      ["L", "彼(彼女)に対してどう関わっているかについて，少し曖昧にしておこうと気をつけている。"],
      ["A", "彼(彼女)が苦しむくらいなら私自身が苦しんだほうがましだ。"],
      ["E", "彼（彼女）と私は外見的にうまく釣り合っている。"],
      ["A", "私自身の幸福よりも，彼(彼女)の幸福が優先しないと，私は幸福にはなれない。"],
      ["M", "彼(彼女)が気にかけてくれないときは，すっかり気がめいってしまう。"],
      ["S", "私たちの友情は，時間をかけて次第に愛へと変わった。"],
      ["A", "彼(彼女)の望みをかなえるためなら，私自身の望みはいつでも喜んで犠牲にできる。"],
      ["M", "彼(彼女)が誰か他の人と付き合っているのではないかと疑うと，落ち着いてられない。"],
      ["E", "彼（彼女）と私は，お互いが結びついていると感じる。"],
      ["E", "彼（彼女）と私はかなり早く，感情的にのめり込んでしまった。"],
      ["S", "彼(彼女)との友情を大切にしたい。"],
      ["L", "彼(彼女)が私に頼りすぎるときは，私は少し身を引きたくなる。"],
      ["M", "私は気がつくと，いつも彼(彼女)のことを考えている。"],
      ["E", "彼（彼女）と私はお互いに，本当に理解しあっている。"],
      ["L", "彼(彼女)に期待を持たせたり，彼（彼女）が私との恋に夢中になり過ぎないように気をつけている。"],
      ["M", "彼(彼女)が私以外の異性と楽しそうにしていると，気になって仕方がない。"],
      ["L", "私が必要だと感じたときだけ彼(彼女)にそばにいてほしいと思う。"],
      ["A", "私は彼(彼女)と一緒なら，どんな貧乏な暮らしでも平気である。"],
      ["M", "彼(彼女)は私だけのものであって欲しい。"],
      ["L", "彼(彼女)とはあまり深入りせず，すっきりした関係でありたい。"],
      ["A", "彼(彼女)のためなら，死ぬ事さえもおそれない。"],
      ["M", "彼(彼女)には，いつも私のことだけを考えていてほしい。"],
      ["E", "彼(彼女)と一緒にいると，私たちが本当に愛し合っている事を実感する。"],
      ["L", "彼(彼女)とは定期的に会うよりも，気が向いたときにだけ会っている。"],
      ["A", "彼(彼女)のためなら，できないこともできるようにしてみせる。"],
      ["M", "彼(彼女)とケンカをすると，不安や心配でやつれてしまう。"],
      ["M", "彼(彼女)からの愛情が，ほんのわずかでも欠けていると感じたときには，悩み苦しむ。"],
      ["S", "彼(彼女)との交際が終わっても，友人でいたいと思う。"],
      ["S", "彼(彼女)とは，友人関係から自然に恋人関係へと発展した(させたい)。"],
      ["M", "彼(彼女)のことを思うと，強い感情が突き上げてどうしようもなくなる。"],
      ["A", "どんなにつらくても私は彼(彼女)に対して，いつもやさしくしてあげたい。"],
      ["A", "たとえ彼(彼女)からまったく愛されなくても，私は彼(彼女)を愛していたい。"],
      ["E", "彼(彼女)と私は，お互いに出会うために，この世に生まれてきたような気がする。"],
      ["E", "彼(彼女)との愛を大切にしたいと，気を使っている。"],
      ["S", "長い友人付き合いを経て，恋人同士になった。"],
      ["E", "彼(彼女)といると甘く優しい雰囲気になる。"],
      ["L", "私は彼(彼女)にあれこれ干渉されると，その人と別れたくなる。"],
      ["A", "彼(彼女)のためなら，どんなことでも我慢できる。"]
    ]
  },
  {
    id: "p2",
    title: "第2部",
    instruction: "あなたの異性観や恋愛に関する意見や経験について答えてください。",
    items: [
      ["P", "私は，交際相手と深く関わる前に，深く関わったあと相手がどんな変化を見せるだろうかとよく考える。"],
      ["P", "私は恋人を選ぶ前に，自分の人生を慎重に計画しようとする。"],
      ["P", "恋人を選ぶときには，その人が私の家族にどう受け入れられるかを一番に考える。"],
      ["L", "特定の交際相手を決めたくないと思う。"],
      ["P", "恋人を選ぶのに重要な要素は，その人がよい親になるかどうかだ。"],
      ["P", "恋人を選ぶときには，その人が私の経歴にどう影響するかも考える。"],
      ["P", "恋人を選ぶときには，その人は将来性があるだろうかと考えてみる。"],
      ["S", "最良の愛は，良い友情の中から育つ。"],
      ["P", "恋人を選ぶときには，その人の学歴や育ち(家柄)が私と釣り合ってるかどうかを考える。"],
      ["P", "恋人を選ぶときには，その人に経済力があるかどうかを考える。"],
      ["P", "恋人を選ぶときには，その人との付き合いは，私の格(レベル)を下げないかと考える。"],
      ["L", "交際相手から頼られすぎたりベタベタされるのが嫌である。"],
      ["S", "これまでもっとも満足した恋愛関係は，よい友情から発展してきた。"]
    ]
  }
];

const LIKERT_LABELS = [
  "よく当てはまる",
  "少し当てはまる",
  "どちらともいえない",
  "あまり当てはまらない",
  "まったく当てはまらない"
];

// ページを移動しても回答を参照できるよう、設問IDをキーにして保持します。
const answers = {};

// 設問文などをHTMLへ入れる際の特殊文字を無害化します。
function escapeHtml(text) {
  const replacements = {
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  };

  return String(text).replace(/[&<>"']/g, character => replacements[character]);
}

// ページ切り替え・結果表示のあとに、必ず画面の一番上から見せます。
// 描画やグラフのサイズ調整で位置がずれることがあるため、少し遅らせてもう一度戻します。
function scrollToTop() {
  window.scrollTo(0, 0);
  requestAnimationFrame(() => window.scrollTo(0, 0));
  setTimeout(() => window.scrollTo(0, 0), 150);
}

/* ---------- 質問画面 ---------- */

// 各部を QUESTIONS_PER_PAGE 問ずつのページに分けます（設問の順番は元のまま）。
function buildPages() {
  const pages = [];

  PARTS.forEach(part => {
    for (let start = 0; start < part.items.length; start += QUESTIONS_PER_PAGE) {
      pages.push({
        part: part,
        start: start,
        items: part.items.slice(start, start + QUESTIONS_PER_PAGE)
      });
    }
  });

  return pages;
}

function createQuestion(part, itemNumber, itemText) {
  return {
    name: `${part.id}_${itemNumber}`,
    prompt: `${itemNumber}. ${escapeHtml(itemText)}`,
    labels: LIKERT_LABELS,
    required: true
  };
}

function createPageTrial(page, pageIndex, totalPages) {
  const isLastPage = pageIndex === totalPages - 1;

  return {
    type: jsPsychSurveyLikert,
    preamble: `
      <div class="card">
        <div class="eyebrow">${pageIndex + 1}／${totalPages}</div>
        <h2>【${escapeHtml(page.part.title)}】</h2>
        <p><b>${escapeHtml(page.part.instruction)}</b></p>
        <p class="muted">各文について、最も近い選択肢を選んでください。各項目の回答は必須です。</p>
      </div>
    `,
    questions: page.items.map((item, index) =>
      createQuestion(page.part, page.start + index + 1, item[1])
    ),
    button_label: isLastPage ? "結果を見る" : "次へ",
    on_load: scrollToTop,
    on_finish: trialData => {
      Object.assign(answers, trialData.response);
    }
  };
}

/* ---------- 採点 ---------- */

function calculateDomainScores() {
  const sums = {};
  DOMAIN_ORDER.forEach(domain => { sums[domain] = 0; });

  PARTS.forEach(part => {
    part.items.forEach((item, index) => {
      const itemId = `${part.id}_${index + 1}`;

      // JsPsych の選択肢番号は 0〜4。得点は 1〜5 に直します。
      const responseValue = answers[itemId] + 1;

      if (!Number.isInteger(responseValue) || responseValue < 1 || responseValue > 5) {
        throw new Error(`回答が見つからないか不正です: ${itemId}`);
      }

      sums[item[0]] += responseValue;
    });
  });

  // 得点変換（S: 41−合計、他: 46−合計）。値が大きいほどその傾向が強い。
  return DOMAIN_ORDER.map(domain => {
    const base = (domain === "S") ? 41 : 46;
    return { domain: domain, score: base - sums[domain] };
  });
}

/* ---------- 結果画面 ---------- */

function createTraitDescriptions() {
  return DOMAIN_ORDER.map(domain => {
    const info = DOMAINS[domain];

    return `
      <article class="trait-description" style="border-left-color: ${info.color};">
        <h3>${escapeHtml(info.label + info.reading)}</h3>
        <p>${escapeHtml(info.description)}</p>
      </article>
    `;
  }).join("");
}

function drawRadarChart(scores) {
  const chartElement = document.getElementById("scoreChart");

  new Chart(chartElement, {
    type: "radar",
    data: {
      // 配列にすると2行で表示され、スマホでもラベルが切れにくい
      labels: scores.map(s => [DOMAINS[s.domain].label, DOMAINS[s.domain].reading]),
      datasets: [{
        data: scores.map(s => s.score),
        fill: true,
        backgroundColor: "rgba(38, 89, 168, 0.22)",
        borderColor: "#2659a8",
        borderWidth: 2,
        pointBackgroundColor: "#2659a8"
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 1,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: context => `得点 ${context.raw}`
          }
        }
      },
      scales: {
        r: {
          min: 0,
          max: 40,
          ticks: { stepSize: 5, backdropColor: "transparent" },
          pointLabels: {
            color: context => DOMAINS[scores[context.index].domain].color,
            font: context => ({
              size: context.chart.width < 420 ? 12 : 15,
              weight: "700"
            })
          }
        }
      }
    }
  });
}

function renderResults() {
  const scores = calculateDomainScores();
  const display = jsPsych.getDisplayElement();

  display.innerHTML = `
    <div class="results card">
      <div class="eyebrow"></div>
      <h1>結果</h1>
      <p class="muted">あなたの6つの恋愛タイプの得点です。
        値が大きいほど，そのタイプの傾向が強いことを示します。</p>
      <div class="chart-wrap">
        <canvas id="scoreChart" role="img" aria-label="6つの恋愛タイプの得点のレーダーチャート"></canvas>
      </div>
      <section class="trait-descriptions" aria-label="各タイプの解説">
        <h2>各タイプの解説</h2>
        ${createTraitDescriptions()}
      </section>
    </div>
  `;

  drawRadarChart(scores);
  scrollToTop();
}

/* ---------- JsPsych 実行 ---------- */

const jsPsych = initJsPsych({ on_finish: renderResults });
const pages = buildPages();

jsPsych.run(pages.map((page, index) => createPageTrial(page, index, pages.length)));
</script>
</body>
</html>
